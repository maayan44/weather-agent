<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Weather Risk Agent">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6bb6ff"/>
      <stop offset="1" stop-color="#1f62b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- the artwork sits slightly above centre so the bolt tip keeps a margin -->
  <g transform="translate(0 -30)">
  <!-- storm cloud -->
  <g fill="#ffffff">
    <rect x="112" y="238" width="288" height="128" rx="64"/>
    <circle cx="196" cy="244" r="66"/>
    <circle cx="288" cy="200" r="90"/>
    <circle cx="356" cy="258" r="58"/>
  </g>
  <!-- warning bolt -->
  <polygon points="278,282 326,282 298,340 342,340 236,468 262,384 216,384"
           fill="#ffc83d" stroke="#1f62b8" stroke-width="12" stroke-linejoin="round" paint-order="stroke"/>
  </g>
</svg>
